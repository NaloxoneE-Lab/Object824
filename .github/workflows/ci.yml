name: ci

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

      # The test step is instrumented on purpose: a failing test binary only
      # reports "exit code 1" in the job's conclusion, and the job log needs an
      # authenticated download. Emitting the failing test names as workflow
      # annotations puts them in the public checks API, so a failure is
      # diagnosable without a token.
      - name: cargo test
        shell: pwsh
        run: |
          cargo test --workspace --all-features --no-fail-fast 2>&1 | Tee-Object -FilePath test-output.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $failures = Select-String -Path test-output.txt -Pattern '^test .* FAILED$|^---- .* stdout ----$' |
              Select-Object -First 8
            foreach ($line in $failures) { Write-Output "::error::$($line.Line.Trim())" }
            # The panic's own message is the next line after 'panicked at'; without it
            # a red run names the test and says nothing about why.
            $lines = Get-Content test-output.txt
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match 'panicked at') {
                $until = [Math]::Min($i + 3, $lines.Count - 1)
                for ($j = $i; $j -le $until; $j++) { Write-Output "::error::$($lines[$j].Trim())" }
                $i = $until
              }
            }
          }
          exit $code

      - name: Golden conformance
        run: cargo test -p o824-conformance -- --nocapture
      - run: cargo build --release --bin o824

  # The npm package runs the same replayer as WebAssembly under Node. Node's WASI is
  # an experimental API, so it is checked on the oldest supported Node and the newest
  # one rather than a single version: a break on either is a break for a UI developer.
  mock-package:
    # The package's claim is "no Windows needed", so the newest supported Node also runs
    # on Linux: the WASI preopen mapping and the path rules are exactly what differs
    # between the two, and a claim nothing tests is a guess.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: 20
          - os: windows-latest
            node: 24
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2

      - name: Build the package
        shell: pwsh
        run: |
          pwsh -File scripts/build-mock-package.ps1 2>&1 | Tee-Object -FilePath build-mock.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # The job log needs an authenticated download; annotations do not.
            Get-Content build-mock.txt -Tail 12 | ForEach-Object { Write-Output "::error::$_" }
          }
          exit $code

      - name: Test the package
        shell: pwsh
        run: |
          # The files are named explicitly: Node 20 does not expand a glob for --test,
          # and an unmatched pattern exits zero having run nothing.
          $files = Get-ChildItem packages/o824-mock/test -Filter *.test.mjs | ForEach-Object { $_.FullName }
          node --test --test-reporter=spec @files 2>&1 | Tee-Object -FilePath mock-test.txt
          $code = $LASTEXITCODE

          # The count is the check: "23 passed" and "nothing ran" must not look alike.
          $passed = 0
          $match = Select-String -Path mock-test.txt -Pattern 'pass (\d+)' | Select-Object -Last 1
          if ($match) { $passed = [int]$match.Matches[0].Groups[1].Value }
          Write-Output "passing tests: $passed (at least 23 expected)"
          if ($passed -lt 23) {
            Write-Output "::error::only $passed tests ran; the suite did not execute"
            $code = 1
          }

          if ($code -ne 0) {
            # Annotations are readable without a token; the job log is not. The failing
            # test's own message is what makes a red run actionable.
            $lines = Get-Content mock-test.txt
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^\s*✖|^\s*not ok') {
                $end = [Math]::Min($i + 6, $lines.Count - 1)
                for ($j = $i; $j -le $end; $j++) { Write-Output "::error::$($lines[$j].Trim())" }
                $i = $end
              }
            }
          }
          exit $code

      # The tarball is what a developer installs, so it is installed here. The check
      # writes a request before reading, so it never depends on the runner's stdin
      # being at end-of-file: a mock with no input would exit zero without proving
      # anything.
      - name: Install the tarball and replay a recording
        shell: pwsh
        run: |
          $tgz = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "dist") -Filter "o824-mock-*.tgz" |
            Select-Object -First 1
          node scripts/verify-mock-release.mjs $tgz.FullName
          if ($LASTEXITCODE -ne 0) { throw "the release asset does not work as installed" }

  # The SDK is TypeScript compiled to ESM, tested against the mock (a real protocol
  # server) rather than a hand-written fake. Node 20 and 24 for the same reason as the
  # mock: the published package must work on the oldest Node it claims.
  sdk:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: 20
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2

      # The tests drive packages/o824-mock, so it has to exist first.
      - name: Build the mock
        shell: pwsh
        run: pwsh -File scripts/build-mock-package.ps1

      - name: Build the SDK
        working-directory: packages/o824-sdk
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Test the SDK
        shell: pwsh
        working-directory: packages/o824-sdk
        run: |
          node --test "test/*.test.mjs" 2>&1 | Tee-Object -FilePath sdk-test.txt
          $code = $LASTEXITCODE
          $passed = 0
          $match = Select-String -Path sdk-test.txt -Pattern 'pass (\d+)' | Select-Object -Last 1
          if ($match) { $passed = [int]$match.Matches[0].Groups[1].Value }
          Write-Output "passing tests: $passed (at least 18 expected)"
          if ($passed -lt 18) {
            Write-Output "::error::only $passed tests ran; the suite did not execute"
            $code = 1
          }
          if ($code -ne 0) {
            $lines = Get-Content sdk-test.txt
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^\s*✖|not ok|AssertionError|Error \[') {
                $until = [Math]::Min($i + 3, $lines.Count - 1)
                for ($j = $i; $j -le $until; $j++) { Write-Output "::error::$($lines[$j].Trim())" }
                $i = $until
              }
            }
          }
          exit $code
