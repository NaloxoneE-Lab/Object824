name: ci

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

      # A build with a release key must compile, and must then refuse a manifest signed by a
      # different key. The key here is thrown away with the runner: CI has no access to the
      # real release key, and this exercises the trust path without pretending to sign a real
      # release.
      - name: release key path
        shell: pwsh
        run: |
          # Every command is checked on its own and names itself if it fails: an earlier
          # version of this step reported only "exit code 1" and cost three runs of guessing.
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          function Expect($name, $code) {
            if ($code -ne 0) {
              Write-Output "::error::$name exited $code"
              exit 1
            }
          }

          cargo build --bin o824 2>&1 | Out-Host
          Expect "cargo build (no key)" $LASTEXITCODE

          $key = & ./target/debug/o824.exe manifest-keygen
          Expect "manifest-keygen" $LASTEXITCODE
          # No `\w` here: inside a single-quoted PowerShell string it is a literal backslash,
          # the pattern never matches, and `$null.Matches` then kills the step before it can
          # say why. A plain character class needs no escaping in YAML or in PowerShell.
          $found = $key | Select-String -Pattern 'public key: ([0-9a-f]{64})'
          $public = if ($found) { $found.Matches[0].Groups[1].Value } else { $null }
          if (-not $public -or $public.Length -ne 64) {
            Write-Output "::error::no usable public key; keygen said: $($key -join ' | ')"
            exit 1
          }

          $env:O824_RELEASE_KEY = $public
          cargo clean -p o824-manifest 2>&1 | Out-Host
          Expect "cargo clean" $LASTEXITCODE
          cargo build --bin o824 2>&1 | Out-Host
          Expect "cargo build (with key)" $LASTEXITCODE

          $manifest = ".ci-manifest"
          New-Item -ItemType Directory -Force -Path $manifest | Out-Null
          Set-Content -Path (Join-Path $manifest "o824.exe") -Value "not a real binary"
          $other = ".ci-other.hex"
          & ./target/debug/o824.exe manifest-keygen --out $other | Out-Null
          Expect "manifest-keygen --out" $LASTEXITCODE
          & ./target/debug/o824.exe manifest --root $manifest --out (Join-Path $manifest "manifest.json") --version 9.9.9 --key-file $other | Out-Null
          Expect "manifest" $LASTEXITCODE

          $verdict = & ./target/debug/o824.exe update --check --manifest (Join-Path $manifest "manifest.json") --version 0.1.0 2>&1
          $code = $LASTEXITCODE
          $verdict | ForEach-Object { Write-Output $_ }
          $summary = "release key step: exit $code`n`n" + ($verdict -join "`n")
          if ($env:GITHUB_STEP_SUMMARY) { $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
          if ($code -ne 5) {
            Write-Output "::error::a foreign signature must exit 5, got $code"
            exit 1
          }
          Write-Output "release key path: a foreign signature was refused with exit 5"
          Remove-Item -Recurse -Force $manifest, $other -ErrorAction SilentlyContinue

      - name: cargo test
        shell: pwsh
        run: |
          cargo test --workspace --all-features --no-fail-fast 2>&1 | Tee-Object -FilePath test-output.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $failures = Select-String -Path test-output.txt -Pattern '^test .* FAILED$|^---- .* stdout ----$' |
              Select-Object -First 8
            foreach ($line in $failures) { Write-Output "::error::$($line.Line.Trim())" }
            # A failure that matches no test name — a binary that could not run, a compile
            # error, a doctest — used to leave nothing but "exit code 1". The tail of the
            # output becomes an annotation so the reason is readable without a token.
            if ($failures.Count -eq 0) {
              foreach ($raw in ((Get-Content test-output.txt) | Select-Object -Last 40)) {
                Write-Output "::error::$($raw.Trim())"
              }
            }
            # The panic's own message is the next line after 'panicked at'; without it
            # a red run names the test and says nothing about why.
            $lines = Get-Content test-output.txt
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match 'panicked at') {
                $until = [Math]::Min($i + 3, $lines.Count - 1)
                for ($j = $i; $j -le $until; $j++) { Write-Output "::error::$($lines[$j].Trim())" }
                $i = $until
              }
            }
          }
          exit $code

      - name: Golden conformance
        run: cargo test -p o824-conformance -- --nocapture
      - run: cargo build --release --bin o824

  # The npm package runs the same replayer as WebAssembly under Node. Node's WASI is
  # an experimental API, so it is checked on the oldest supported Node and the newest
  # one rather than a single version: a break on either is a break for a UI developer.
  mock-package:
    # The package's claim is "no Windows needed", so the newest supported Node also runs
    # on Linux: the WASI preopen mapping and the path rules are exactly what differs
    # between the two, and a claim nothing tests is a guess.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: 20
          - os: windows-latest
            node: 24
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2

      - name: Build the package
        shell: pwsh
        run: |
          pwsh -File scripts/build-mock-package.ps1 2>&1 | Tee-Object -FilePath build-mock.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # The job log needs an authenticated download; annotations do not.
            Get-Content build-mock.txt -Tail 12 | ForEach-Object { Write-Output "::error::$_" }
          }
          exit $code

      - name: Test the package
        shell: pwsh
        run: |
          # The files are named explicitly: Node 20 does not expand a glob for --test,
          # and an unmatched pattern exits zero having run nothing.
          $files = Get-ChildItem packages/o824-mock/test -Filter *.test.mjs | ForEach-Object { $_.FullName }
          node --test --test-reporter=spec @files 2>&1 | Tee-Object -FilePath mock-test.txt
          $code = $LASTEXITCODE

          # The count is the check: "23 passed" and "nothing ran" must not look alike.
          $passed = 0
          $match = Select-String -Path mock-test.txt -Pattern 'pass (\d+)' | Select-Object -Last 1
          if ($match) { $passed = [int]$match.Matches[0].Groups[1].Value }
          Write-Output "passing tests: $passed (at least 23 expected)"
          if ($passed -lt 23) {
            Write-Output "::error::only $passed tests ran; the suite did not execute"
            $code = 1
          }

          if ($code -ne 0) {
            # Annotations are readable without a token; the job log is not. The failing
            # test's own message is what makes a red run actionable.
            $lines = Get-Content mock-test.txt
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^\s*✖|^\s*not ok') {
                $end = [Math]::Min($i + 6, $lines.Count - 1)
                for ($j = $i; $j -le $end; $j++) { Write-Output "::error::$($lines[$j].Trim())" }
                $i = $end
              }
            }
          }
          exit $code

      # The tarball is what a developer installs, so it is installed here. The check
      # writes a request before reading, so it never depends on the runner's stdin
      # being at end-of-file: a mock with no input would exit zero without proving
      # anything.
      - name: Install the tarball and replay a recording
        shell: pwsh
        run: |
          $tgz = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "dist") -Filter "o824-mock-*.tgz" |
            Select-Object -First 1
          node scripts/verify-mock-release.mjs $tgz.FullName
          if ($LASTEXITCODE -ne 0) { throw "the release asset does not work as installed" }

  # The SDK is TypeScript compiled to ESM, tested against the mock (a real protocol
  # server) rather than a hand-written fake. Node 20 and 24 for the same reason as the
  # mock: the published package must work on the oldest Node it claims.
  sdk:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: 20
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2

      # The tests drive packages/o824-mock, so it has to exist first.
      - name: Build the mock
        shell: pwsh
        run: pwsh -File scripts/build-mock-package.ps1

      - name: Build the SDK
        working-directory: packages/o824-sdk
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Test the SDK
        shell: pwsh
        working-directory: packages/o824-sdk
        run: |
          # Named explicitly: Node 20 does not expand a glob for --test, and an
          # unmatched pattern exits zero having run nothing.
          $files = Get-ChildItem test -Filter *.test.mjs | ForEach-Object { $_.FullName }
          node --test @files 2>&1 | Tee-Object -FilePath sdk-test.txt
          $code = $LASTEXITCODE
          $passed = 0
          $match = Select-String -Path sdk-test.txt -Pattern 'pass (\d+)' | Select-Object -Last 1
          if ($match) { $passed = [int]$match.Matches[0].Groups[1].Value }
          Write-Output "passing tests: $passed (at least 18 expected)"
          if ($passed -lt 18) {
            Write-Output "::error::only $passed tests ran; the suite did not execute"
            $code = 1
          }
          if ($code -ne 0) {
            $lines = Get-Content sdk-test.txt
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^\s*✖|not ok|AssertionError|Error \[') {
                $until = [Math]::Min($i + 3, $lines.Count - 1)
                for ($j = $i; $j -le $until; $j++) { Write-Output "::error::$($lines[$j].Trim())" }
                $i = $until
              }
            }
          }
          exit $code
