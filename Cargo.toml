[workspace]
resolver = "2"
members = ["crates/*"]
# The YAML spike is a throw-away probe with its own dependency set; it must not
# leak crates into the shipped workspace.
exclude = ["spikes/yaml-spike", "apps/o824-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.89 is where `File::try_lock` and `File::unlock` became stable, which is what the
# kernel lock uses instead of a CreateFileW share mode. CI tracks stable, so this
# only bounds what a developer may compile the workspace with.
rust-version = "1.89"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# `preserve_order` is not optional: Go's struct field order is part of the
# golden contract, and serde_json's default BTreeMap would sort every key.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
similar = "2"
# libyaml, translated to Rust. Chosen so YAML acceptance and parse-error lines
# match the reference implementation exactly; see crates/o824-yaml/src/lib.rs.
unsafe-libyaml = "0.2"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_System_Com_Urlmon",
] }

o824-errs = { path = "crates/o824-errs" }
o824-install = { path = "crates/o824-install" }
o824-manifest = { path = "crates/o824-manifest" }
o824-model = { path = "crates/o824-model" }
o824-version = { path = "crates/o824-version" }
o824-yaml = { path = "crates/o824-yaml" }
o824-execx = { path = "crates/o824-execx" }
o824-lock = { path = "crates/o824-lock" }
o824-state = { path = "crates/o824-state" }
o824-discovery = { path = "crates/o824-discovery" }
o824-fixtures = { path = "crates/o824-fixtures" }
o824-verify = { path = "crates/o824-verify" }
o824-plan = { path = "crates/o824-plan" }
o824-present = { path = "crates/o824-present" }
o824-snapshot = { path = "crates/o824-snapshot" }
o824-apply = { path = "crates/o824-apply" }
o824-protocol = { path = "crates/o824-protocol" }
o824-bridge = { path = "crates/o824-bridge" }
o824-kernel = { path = "crates/o824-kernel" }
o824-formproc = { path = "crates/o824-formproc" }
o824-mock = { path = "crates/o824-mock" }
o824-diagnose = { path = "crates/o824-diagnose" }
o824-cli = { path = "crates/o824-cli" }
o824-conformance = { path = "crates/o824-conformance" }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
