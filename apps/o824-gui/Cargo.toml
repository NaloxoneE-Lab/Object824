[package]
name = "o824-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false
description = "the O824 window: a thin shell over the kernel, and nothing else."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
o824-bridge = { path = "../../crates/o824-bridge" }
o824-present = { path = "../../crates/o824-present" }
o824-model = { path = "../../crates/o824-model" }
o824-install = { path = "../../crates/o824-install" }
o824-manifest = { path = "../../crates/o824-manifest" }
o824-version = { path = "../../crates/o824-version" }
o824-formproc = { path = "../../crates/o824-formproc" }
o824-state = { path = "../../crates/o824-state" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The announcement bar reads the DeepSeek docs pages. The window cannot: the site answers
# without CORS headers, so the fetch has to happen in this process. rustls only — no OpenSSL,
# no system TLS store to configure.
ureq = { version = "2", default-features = false, features = ["tls"] }
tauri = { version = "2", features = ["tray-icon"] }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[workspace]
