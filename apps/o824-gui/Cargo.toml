[package]
name = "o824-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false
description = "the O824 window: a thin shell over the kernel, and nothing else."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
o824-bridge = { path = "../../crates/o824-bridge" }
o824-present = { path = "../../crates/o824-present" }
o824-model = { path = "../../crates/o824-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[workspace]
