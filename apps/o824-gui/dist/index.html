<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>O824</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- The window draws sentences the kernel produced; it never invents one. -->
    <header class="bar">
      <span class="mark">824</span>
      <span class="trust" id="trust"></span>
    </header>

    <main id="main">
      <section class="hero">
        <h1 id="headline">…</h1>
        <p id="reason" class="reason"></p>
        <button id="primary" class="primary" hidden></button>
        <!-- §21.5: start and stop are actions of the same flow, so they sit beside repair
             rather than on a different page. -->
        <div id="form-buttons" class="actions inline" hidden>
          <button id="form-stop" class="quiet" hidden></button>
          <a id="form-url" class="link" target="_blank" rel="noreferrer" hidden></a>
        </div>
      </section>

      <section id="installations" class="list" hidden></section>
      <section id="findings" class="list" hidden></section>

      <!-- §20.3: the safety net is shown before anything moves, and the way out is a
           button, not a sentence. -->
      <section id="confirm-panel" class="confirm" hidden>
        <p id="backup" class="backup"></p>
        <p id="steps-heading" class="steps-heading"></p>
        <ul id="steps" class="steps"></ul>
        <div class="actions">
          <button id="confirm-cancel" class="quiet"></button>
          <button id="confirm-start" class="primary"></button>
        </div>
      </section>
      <section id="failure" class="failure" hidden></section>
    </main>

    <footer class="bar">
      <button id="copy" class="quiet" hidden>Copy diagnostic information</button>
      <span class="spacer"></span>
      <span id="status" class="status"></span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
