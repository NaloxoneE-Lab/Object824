<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>O824</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- The board: a distribution rail, one hero, one start control. Every sentence about
         the machine is written by the kernel; every label around it comes from the copy
         crate, so neither language is assembled here. -->
    <div class="app" id="app">
      <aside class="rail" data-tauri-drag-region>
        <div class="rail-logo" data-tauri-drag-region>
          <img src="assets/logo.png" alt="O824" />
        </div>
        <nav class="tabs" id="tabs" aria-label=""></nav>
        <!-- The launcher draws its "all games" button as four 6×6 white squares in a 14×14
             box, stretched 1.4× horizontally when idle and rotated 45° when open. -->
        <button class="rail-foot" id="all-installs" aria-label="">
          <span class="all-games" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        </button>
      </aside>

      <main class="stage" data-tauri-drag-region>
        <!-- The real theme art, extracted from the launcher's Qt resources: it already
             contains the grid, the yellow blocks and the ENDFIELD watermark. -->
        <div class="art" data-tauri-drag-region aria-hidden="true"></div>

        <header class="topbar">
          <button class="chip" id="update">
            <!-- The four header icons are the launcher's own web-UI components (extracted
                 from res/web/index.ff0a17.js: xf, Ef, vf, of), not redrawings. The label
                 stays ours: this launcher checks for updates, it does not sign in. -->
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" stroke="none" fill-rule="evenodd" clip-rule="evenodd" d="M13.5 8.5C13.5 7.67157 12.8284 7 12 7C11.1716 7 10.5 7.67157 10.5 8.5C10.5 9.32843 11.1716 10 12 10C12.8284 10 13.5 9.32843 13.5 8.5ZM15.5 8.5C15.5 10.433 13.933 12 12 12C10.067 12 8.5 10.433 8.5 8.5C8.5 6.567 10.067 5 12 5C13.933 5 15.5 6.567 15.5 8.5ZM5 13H19V19H13V17H17V15H7V17H11V19H5V13Z" />
            </svg>
            <span id="update-label"></span>
            <i class="dot" id="update-dot" hidden></i>
          </button>
          <button class="round" id="settings" aria-label="">
            <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
              <path fill="currentColor" stroke="none" fill-rule="evenodd" clip-rule="evenodd" d="M4.36128 3.22889L3.61641 2.48401L2.2022 3.89823L2.99448 4.69051C2.50552 5.42858 2.17543 6.28107 2.05297 7.19922L0.5 7.19922V9.19922H2.11986C2.30316 10.1028 2.68953 10.9327 3.22926 11.6392L2.48445 12.384L3.89866 13.7982L4.69104 13.0059C5.42898 13.4946 6.28128 13.8246 7.19922 13.947V15.5H9.19921L9.19922 13.8801C9.96581 13.7246 10.6794 13.423 11.3095 13.0055L12.1017 13.7977L13.5159 12.3835L12.7711 11.6387C13.3106 10.9323 13.6969 10.1026 13.8801 9.19922H15.5V7.19922H13.947C13.8246 6.28129 13.4946 5.42899 13.0059 4.69104L13.7982 3.89875L12.3839 2.48453L11.6392 3.22927C10.9327 2.68953 10.1028 2.30316 9.19922 2.11986L9.19922 0.5H7.19922V2.05297C6.14117 2.19408 5.17032 2.61093 4.36128 3.22889ZM8 12.4C10.4301 12.4 12.4 10.4301 12.4 8C12.4 5.56995 10.4301 3.6 8 3.6C5.56995 3.6 3.6 5.56995 3.6 8C3.6 10.4301 5.56995 12.4 8 12.4ZM8 6.58569L8.28284 6.86854L9.13137 7.71706L9.41421 7.99991L9.13137 8.28275L8.28284 9.13128L8 9.41412L7.71716 9.13128L6.86863 8.28275L6.58579 7.99991L6.86863 7.71706L7.71716 6.86854L8 6.58569Z" />
            </svg>
          </button>
          <button class="round" id="minimize" aria-label="">
            <svg class="ico" viewBox="0 0 14 14" aria-hidden="true">
              <line x1="0" y1="6.8" x2="14" y2="6.8" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>
          <button class="round" id="close" aria-label="">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="12" y="11.2928" width="1" height="1" transform="rotate(45 12 11.2928)" stroke="currentColor" fill="none" />
              <path fill="currentColor" stroke="none" fill-rule="evenodd" clip-rule="evenodd" d="M13.5562 9.31353L17.0917 5.778L18.5059 7.19221L14.9704 10.7277L13.5562 9.31353ZM5.77746 17.0912L9.31299 13.5556L10.7272 14.9698L7.19167 18.5054L5.77746 17.0912ZM14.687 13.5556L18.2225 17.0912L16.8083 18.5054L13.2728 14.9698L14.687 13.5556ZM6.90883 5.77745L10.4444 9.31298L9.03015 10.7272L5.49462 7.19166L6.90883 5.77745Z" />
            </svg>
          </button>
        </header>

        <section class="hero-copy" id="hero">
          <div class="eyebrow">
            <span class="state-dot" id="state-dot"></span>
            <span id="eyebrow-kind"></span>
            <span class="version" id="version" hidden></span>
          </div>
          <h1 id="headline">…</h1>
          <p id="reason"></p>
          <div class="hero-links">
            <button class="text-link" id="detail-link" hidden></button>
            <button class="text-link" id="open-link" hidden></button>
          </div>
        </section>

        <div class="launch">
          <div class="menu" id="menu" hidden>
            <button class="menu-item" id="menu-settings"></button>
            <button class="menu-item" id="menu-shortcut"></button>
            <button class="menu-item" id="menu-integrity"></button>
            <button class="menu-item separated" id="menu-cache"></button>
          </div>
          <!-- One yellow pill, not a pill plus a circle: the reference puts the menu inside the
               right end of the start control, with a ring of yellow around it. -->
          <div class="cta-shell" id="cta-shell">
            <button class="cta" id="primary">
              <span class="cta-play" id="primary-badge">
                <svg class="ico" id="primary-icon" viewBox="0 0 24 24" aria-hidden="true"></svg>
              </span>
              <span id="primary-label"></span>
            </button>
            <button class="menu-toggle" id="menu-toggle" aria-label="" aria-expanded="false">
              <svg class="ico" viewBox="0 0 18 12" aria-hidden="true" id="menu-icon">
                <path fill="currentColor" stroke="none" d="M18 12H0V10H18V12ZM18 7H0V5H18V7ZM18 2H0V0H18V2Z" />
              </svg>
            </button>
          </div>
          <label class="checkline">
            <input type="checkbox" id="after-start" />
            <span id="after-start-label"></span>
          </label>
        </div>
      </main>
    </div>

    <div class="toast" id="toast" hidden>
      <span id="toast-text"></span>
    </div>

    <div class="overlay" id="overlay" hidden>
      <!-- Settings is the one dialog with its own navigation, so it is not built from the
           generic sheet. -->
      <section class="sheet settings-sheet" id="sheet-settings" role="dialog" aria-modal="true" hidden>
        <header class="sheet-head">
          <svg class="ico head-ico" viewBox="0 0 16 16" aria-hidden="true">
            <path fill="currentColor" stroke="none" fill-rule="evenodd" clip-rule="evenodd" d="M4.36128 3.22889L3.61641 2.48401L2.2022 3.89823L2.99448 4.69051C2.50552 5.42858 2.17543 6.28107 2.05297 7.19922L0.5 7.19922V9.19922H2.11986C2.30316 10.1028 2.68953 10.9327 3.22926 11.6392L2.48445 12.384L3.89866 13.7982L4.69104 13.0059C5.42898 13.4946 6.28128 13.8246 7.19922 13.947V15.5H9.19921L9.19922 13.8801C9.96581 13.7246 10.6794 13.423 11.3095 13.0055L12.1017 13.7977L13.5159 12.3835L12.7711 11.6387C13.3106 10.9323 13.6969 10.1026 13.8801 9.19922H15.5V7.19922H13.947C13.8246 6.28129 13.4946 5.42899 13.0059 4.69104L13.7982 3.89875L12.3839 2.48453L11.6392 3.22927C10.9327 2.68953 10.1028 2.30316 9.19922 2.11986L9.19922 0.5H7.19922V2.05297C6.14117 2.19408 5.17032 2.61093 4.36128 3.22889ZM8 12.4C10.4301 12.4 12.4 10.4301 12.4 8C12.4 5.56995 10.4301 3.6 8 3.6C5.56995 3.6 3.6 5.56995 3.6 8C3.6 10.4301 5.56995 12.4 8 12.4ZM8 6.58569L8.28284 6.86854L9.13137 7.71706L9.41421 7.99991L9.13137 8.28275L8.28284 9.13128L8 9.41412L7.71716 9.13128L6.86863 8.28275L6.58579 7.99991L6.86863 7.71706L7.71716 6.86854L8 6.58569Z" />
          </svg>
          <h2 id="settings-title"></h2>
          <button class="icon-btn sheet-x" data-close aria-label="">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </header>
        <div class="settings-body">
          <nav class="settings-nav">
            <button class="nav-item is-active" id="nav-launcher"></button>
            <button class="nav-item" id="nav-about"></button>
          </nav>
          <div class="settings-pages">
            <section id="page-launcher">
              <div class="group">
                <div class="group-head" id="group-startup"></div>
                <label class="switchrow">
                  <input type="checkbox" id="set-autostart" />
                  <span class="switch-text">
                    <span class="switch-title" id="set-autostart-title"></span>
                    <span class="switch-detail" id="set-autostart-detail"></span>
                  </span>
                </label>
              </div>
              <div class="group">
                <div class="group-head" id="group-update"></div>
                <label class="switchrow">
                  <input type="checkbox" id="set-autoupdate" />
                  <span class="switch-text">
                    <span class="switch-title" id="set-autoupdate-title"></span>
                    <span class="switch-detail" id="set-autoupdate-detail"></span>
                  </span>
                </label>
              </div>
              <div class="group">
                <div class="group-head" id="group-close"></div>
                <label class="switchrow">
                  <input type="checkbox" id="set-tray" />
                  <span class="switch-text">
                    <span class="switch-title" id="set-tray-title"></span>
                    <span class="switch-detail" id="set-tray-detail"></span>
                  </span>
                </label>
              </div>
              <p class="fineprint" id="tray-note" hidden></p>
            </section>

            <section id="page-about" hidden>
              <div class="about">
                <img class="about-logo" src="assets/logo.png" alt="" />
                <div class="about-name">O824</div>
                <div class="about-version" id="about-version"></div>
                <div class="about-tagline" id="about-tagline"></div>
                <button class="about-repo" id="about-repo"></button>
                <div class="about-url">github.com/NaloxoneE-Lab/Object824</div>
                <div class="about-actions">
                  <button class="btn-quiet" id="about-update"></button>
                  <button class="btn-quiet" id="about-trust"></button>
                  <button class="btn-quiet" id="about-copy"></button>
                  <button class="btn-quiet" id="about-log"></button>
                </div>
              </div>
            </section>
          </div>
        </div>
      </section>

      <section class="sheet" id="sheet-details" role="dialog" aria-modal="true" hidden>
        <header class="sheet-head">
          <h2 id="details-title"></h2>
          <button class="icon-btn sheet-x" data-close aria-label="">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </header>
        <div class="sheet-body" id="details-body"></div>
        <footer class="sheet-foot">
          <button class="btn-quiet" id="details-undo" hidden></button>
          <button class="btn-quiet" id="details-copy"></button>
          <button class="btn-quiet" id="details-close" data-close></button>
          <button class="btn-primary" id="details-repair" hidden></button>
        </footer>
      </section>

      <section class="sheet" id="sheet-plan" role="dialog" aria-modal="true" hidden>
        <header class="sheet-head">
          <h2 id="plan-title"></h2>
          <button class="icon-btn sheet-x" data-close aria-label="">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </header>
        <div class="sheet-body">
          <p class="backup" id="plan-backup"></p>
          <p class="steps-heading" id="plan-heading"></p>
          <ol class="steps" id="plan-steps"></ol>
        </div>
        <footer class="sheet-foot">
          <button class="btn-quiet" id="plan-cancel"></button>
          <button class="btn-primary" id="plan-confirm"></button>
        </footer>
      </section>

      <section class="sheet" id="sheet-update" role="dialog" aria-modal="true" hidden>
        <header class="sheet-head">
          <h2 id="update-title"></h2>
          <button class="icon-btn sheet-x" data-close aria-label="">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </header>
        <div class="sheet-body update-body">
          <div class="update-mark" id="update-mark"></div>
          <h3 class="update-headline" id="update-headline"></h3>
          <p class="update-detail" id="update-detail"></p>
          <p class="update-proof" id="update-proof"></p>
        </div>
        <footer class="sheet-foot">
          <button class="btn-quiet" id="update-cancel"></button>
          <button class="btn-primary" id="update-install" hidden></button>
        </footer>
      </section>

      <section class="sheet" id="sheet-install" role="dialog" aria-modal="true" hidden>
        <header class="sheet-head">
          <h2 id="install-title"></h2>
          <button class="icon-btn sheet-x" data-close aria-label="">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </header>
        <div class="sheet-body">
          <p class="install-guidance" id="install-guidance"></p>
          <div class="install-steps" id="install-steps"></div>
        </div>
        <footer class="sheet-foot">
          <button class="btn-primary" data-close id="install-close"></button>
        </footer>
      </section>

      <section class="sheet" id="sheet-trust" role="dialog" aria-modal="true" hidden>
        <header class="sheet-head">
          <h2 id="trust-headline"></h2>
          <button class="icon-btn sheet-x" data-close aria-label="">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </header>
        <div class="sheet-body">
          <p id="trust-reason"></p>
          <p class="steps-heading" id="trust-check"></p>
          <code class="command" id="trust-command"></code>
          <p class="fineprint" id="trust-note"></p>
          <p class="never" id="trust-never"></p>
        </div>
        <footer class="sheet-foot">
          <button class="btn-primary" data-close id="trust-close"></button>
        </footer>
      </section>

      <section class="sheet" id="sheet-close" role="dialog" aria-modal="true" hidden>
        <header class="sheet-head">
          <h2 id="close-title"></h2>
          <button class="icon-btn sheet-x" data-close aria-label="">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </header>
        <div class="sheet-body">
          <p id="close-reason"></p>
          <label class="checkline dark">
            <input type="checkbox" id="close-remember" />
            <span id="close-remember-label"></span>
          </label>
        </div>
        <footer class="sheet-foot">
          <button class="btn-quiet" id="close-quit"></button>
          <button class="btn-primary" id="close-keep"></button>
        </footer>
      </section>

      <section class="sheet" id="sheet-installs" role="dialog" aria-modal="true" hidden>
        <header class="sheet-head">
          <h2 id="installs-title"></h2>
          <button class="icon-btn sheet-x" data-close aria-label="">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </header>
        <div class="sheet-body" id="installs-body"></div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
